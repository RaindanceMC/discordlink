# Same shape as every other standalone here — see rtp-standalone's copy for why each line matters.
name: ${plugin.name}
version: '${plugin.version}'
main: de.raindancer.modules.wrapper.ModulePlugin
bootstrapper: de.raindancer.modules.wrapper.ModuleBootstrap
api-version: '26.3'
description: 'Whitelisting and account links through Discord /link; Discord roles give LuckPerms groups.'
author: Raindancer118
website: https://github.com/Raindancer118/RainsCore

# Discord work runs on async threads; players are only touched on their own thread.
folia-supported: true

dependencies:
  bootstrap:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
  server:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
